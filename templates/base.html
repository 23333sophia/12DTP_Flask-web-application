<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
    <title>Document</title>
</head>

<body>
    <!-- Add the Navigation Bar in the base template so I don;t have to do it again! -->
    <nav>
        <div class="topnav">
            <a class="active" href="/">Home</a>
            <a href="/profile">Profile</a>
            <a href="/discography">Discography</a>
            <a href="/inventory">My Account</a>
            <a href="/login">Login</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>
    <!-- This is the main page with most stuff we need in it -->
    <!-- moved flash messages here so they appear cleanly on every page without bullet points -->
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="flash-messages-container">
        {% for message in messages %}
        <p class="flash-message-text">{{ message }}</p>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}
</body>

</html>
